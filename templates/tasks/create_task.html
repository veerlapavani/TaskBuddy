<!DOCTYPE html>
<html>
<head>
    <title>TaskBuddy - Create Task</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #121212;
            color: white;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: auto;
            padding: 50px 0;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 38px;
            color: #f5c542;
        }

        .header p {
            color: #aaa;
            margin-top: 8px;
        }

        .form-box {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
        }

        .form-box h2 {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #444;
            border-radius: 7px;
            background: #2a2a2a;
            color: white;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .create-btn {
            width: 100%;
            background: #f5c542;
            color: #111;
            border: none;
            padding: 13px;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .create-btn:hover {
            background: #ffd75a;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #aaa;
            text-decoration: none;
        }

        .back-link:hover {
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1><h1>TaskBuddy</h1></h1>
        <p>Your friendly Task Manager</p>
    </div>

    <div class="form-box">

        <h2>Create New Task</h2>

        <form method="POST" action="{% url 'create_task' %}">
            {% csrf_token %}

            <label>Task Title</label>

            <input
                type="text"
                name="title"
                placeholder="Enter task title"
                required
            >

            <label>Description</label>

            <textarea
                name="description"
                placeholder="Enter task description"
            ></textarea>

            <label>Priority</label>

            <select name="priority">
                <option value="Low">Low</option>
                <option value="Medium" selected>Medium</option>
                <option value="High">High</option>
            </select>

            <label>Category</label>

            <select name="category">
                <option value="General" selected>General</option>
                <option value="Personal">Personal</option>
                <option value="Work">Work</option>
                <option value="Study">Study</option>
            </select>

            <button type="submit" class="create-btn">
                Create Task
            </button>

        </form>

        <a href="{% url 'dashboard' %}" class="back-link">
            ← Back to Dashboard
        </a>

    </div>

</div>

</body>
</html>
